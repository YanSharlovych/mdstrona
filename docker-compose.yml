services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-local-wordpress-password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-local-wordpress-password}
      WORDPRESS_DEBUG: "1"
      ALUTECO_SMTP_HOST: mailpit
      ALUTECO_SMTP_PORT: "1025"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        @ini_set( 'display_errors', 0 );
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes/aluteco:/var/www/html/wp-content/themes/aluteco

  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-local-wordpress-password}
      WP_URL: ${WP_URL:-http://localhost:8080}
      WP_TITLE: ${WP_TITLE:-ALUTECO}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-aluteco_admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-local-only-change-me}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.test}
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes/aluteco:/var/www/html/wp-content/themes/aluteco
      - ./docker:/project/docker:ro
    working_dir: /var/www/html
    entrypoint: ["/bin/sh", "/project/docker/setup-wordpress.sh"]
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db_data:
  wordpress_data:

